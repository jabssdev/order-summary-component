<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta
      name="description"
      content="A simple order summary card component built with HTML and CSS"
    />
    <meta
      name="keywords"
      content="HTML,CSS,JavaScript,Frontend,Frontend Mentor,Order Summary Card"
    />
    <meta name="author" content="JabssDev" />
    <title>Frontend Mentor | Order summary card</title>
  </head>
  <body>
    <main>
      <article>
        <h1>Order Summary</h1>
        <div>
          <img
            src="./assets/images/illustration-hero.svg"
            alt="Illustration Hero"
          />
        </div>
        <section>
          <h2>Order Summary</h2>
          <p>
            You can now listen to millions of songs, audiobooks, and podcasts on
            any device anywhere you like!
          </p>
        </section>
        <section aria-labelledby="plan-details">
          <img src="./assets/images/icon-music.svg" alt="Music Icon" />
          <div id="plan-details">
            <h3>Annual Plan</h3>
            <p>$59.99/year</p>
          </div>
          <a href="#">Change</a>
        </section>
        <div>
          <button>Proceed to Payment</button>
          <button>Cancel Order</button>
        </div>
      </article>
    </main>
    <footer>
      Challenge by
      <a
        href="https://www.frontendmentor.io?ref=challenge"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Go to the Frontend Mentor website"
      >
        Frontend Mentor
      </a>
      . Coded by
      <a
        href="https://www.linkedin.com/in/jabssdev/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Go to the LinkedIn profile of JabssDev"
      >
        JabssDev
      </a>
      .
    </footer>
  </body>
</html>

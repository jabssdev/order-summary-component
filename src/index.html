<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta
      name="description"
      content="A simple order summary card component built with HTML and CSS"
    />
    <meta
      name="keywords"
      content="HTML,CSS,JavaScript,Frontend,Frontend Mentor,Order Summary Card"
    />
    <meta name="author" content="JabssDev" />
    <title>Frontend Mentor | Order summary card</title>
  </head>
  <body
    class="font-redhat flex h-dvh flex-col items-center justify-center gap-4 bg-[url('./assets/images/pattern-background-mobile.svg')] bg-cover bg-top bg-no-repeat p-5 md:bg-[url('./assets/images/pattern-background-desktop.svg')] md:bg-contain"
  >
    <main>
      <article
        class="flex max-w-96 flex-col items-center rounded-2xl bg-white shadow-lg/40 shadow-blue-700/40"
      >
        <h1 class="sr-only">Order Summary</h1>
        <header>
          <img
            class="block w-full rounded-ss-2xl rounded-se-2xl object-cover"
            src="./assets/images/illustration-hero.svg"
            alt="Illustration Hero"
          />
        </header>
        <section class="flex flex-col gap-4 p-7 text-center">
          <h2 class="text-xl font-black text-blue-950">Order Summary</h2>
          <p class="mb-2 font-bold text-gray-600">
            You can now listen to millions of songs, audiobooks, and podcasts on
            any device anywhere you like!
          </p>
          <div
            class="mb-2 flex items-center justify-between rounded-xl bg-blue-50 p-4"
          >
            <div class="flex items-center gap-6">
              <img
                class="block aspect-square h-12 w-12 object-cover"
                src="./assets/images/icon-music.svg"
                alt="Music Icon"
              />
              <div class="flex flex-col gap-0.5">
                <h3 class="text-sm font-black">Annual Plan</h3>
                <p class="text-sm font-bold text-gray-600">$59.99/year</p>
              </div>
            </div>
            <a
              href="#"
              class="text-xs font-black text-blue-700 underline hover:text-blue-700/65 hover:no-underline"
            >
              Change
            </a>
          </div>
          <div class="flex flex-col gap-2">
            <button
              class="cursor-pointer rounded-lg bg-blue-700 py-3 font-bold text-white shadow-lg shadow-blue-700/40 hover:bg-blue-700/65"
              type="button"
            >
              Proceed to Payment
            </button>
            <button
              class="cursor-pointer rounded-lg pt-3 font-black text-gray-600 hover:text-blue-950"
              type="button"
            >
              Cancel Order
            </button>
          </div>
        </section>
      </article>
    </main>
    <footer class="text-xs text-gray-600 md:text-sm">
      Challenge by
      <a
        class="font-bold text-blue-950 underline hover:text-blue-700"
        href="https://www.frontendmentor.io?ref=challenge"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Go to the Frontend Mentor website"
      >
        Frontend Mentor
      </a>
      . Coded by
      <a
        class="font-bold text-blue-950 underline hover:text-blue-700"
        href="https://www.linkedin.com/in/jabssdev/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Go to the LinkedIn profile of JabssDev"
      >
        JabssDev
      </a>
      .
    </footer>
  </body>
</html>
